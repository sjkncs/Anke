<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="pi-plugin-chrome" content="v2"><title>深圳租金 · ANKE</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="anke-select.css"></head>
<body>
<header><strong style="display:inline-flex;align-items:center;gap:10px"><svg width="32" height="32" viewBox="0 0 64 64" fill="none" aria-hidden="true" focusable="false" style="display:block;flex:none"><path d="M8 54H56M13 54V29L32 14L51 29V54M23 54V36H41V54" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M32 6V24M23 29H41" stroke="currentColor" stroke-opacity=".4" stroke-width="2.2" stroke-linecap="round"/></svg>ANKE</strong><span>深圳住房</span><button id="openMonitor">住房监测</button><button id="refresh">刷新</button></header>
<nav id="tabs"><button data-tab="overview" class="active">全市总览</button><button data-tab="matching">人才选房</button><button data-tab="profiles">候选人画像</button><button data-tab="workorders">住小智</button><button data-tab="supply">政府与高校房源</button><button data-tab="ledger">市场租金</button><button data-tab="projects">项目比较</button><button data-tab="scenario">调租测算</button><button data-tab="map">地图街景</button><button data-tab="events">租金动态</button></nav>
<div class="filters"><select id="dataset" aria-label="数据集"><option value="imported">导入数据</option><option value="demo">演示数据</option></select><select id="district" aria-label="行政区"><option value="">全市</option></select><select id="recordType" aria-label="记录类型"><option>挂牌</option><option>成交</option></select><select id="lease" aria-label="租赁方式"><option>整租</option><option>合租</option></select><input id="query" placeholder="搜索项目、地址" aria-label="搜索项目、地址"></div>
<script defer src="rent-visuals.js"></script><script defer src="housing-presentation.js"></script><link rel="stylesheet" href="rent-visuals.css"><link rel="stylesheet" href="housing-presentation.css">
<main><div id="status" role="status" aria-live="polite"></div>
<section id="overview" class="page"><div id="housingMetrics" class="metrics"></div><div class="housing-layout"><aside><article><h2>房源供应</h2><div id="supplySummary"></div></article><article><h2>各区租金 · 元/㎡/月</h2><div id="bars"></div></article></aside><article class="spatial-panel"><div class="section-head"><h2>房源分布</h2><button id="spatialMap">百度地图</button></div><div id="spatial"><canvas id="spatialCanvas" aria-label="房源三维空间分布"></canvas><div id="spatialEmpty">待接入房源坐标</div><div id="spatialSelection"></div></div><div id="metrics" class="market-metrics"></div></article><aside><article><h2>需求匹配</h2><select id="overviewCandidate" aria-label="选择候选人"></select><div id="topMatches"></div><button id="overviewSearch">查看推荐</button></article><article><h2>办理进度</h2><div id="orderSummary"></div></article></aside></div><div id="coverage" hidden></div></section>
<section id="matching" class="page" hidden><div class="section-head"><h2>人才选房</h2><select id="candidate" aria-label="候选人"></select><input id="housingQuery" placeholder="搜索项目、房源" aria-label="搜索可供房源"><select id="housingSort" aria-label="推荐排序"><option value="balanced">综合适配</option><option value="shortTerm">短期优势</option><option value="longTerm">长期适配</option></select><button id="searchHomes">推荐住房</button></div><div id="candidateSummary" class="profile-summary"></div><div id="homeResults" class="home-results"></div></section>
<section id="profiles" class="page" hidden><div class="section-head"><h2>候选人画像</h2><select id="profileSelect" aria-label="已登记候选人"></select><button id="newProfile">新增画像</button></div><form id="profileForm" class="profile-form"></form></section>
<section id="workorders" class="page" hidden><div class="section-head"><h2>住小智</h2><select id="orderSelect" aria-label="住房工单"></select><button id="newOrder">新建工单</button></div><form id="orderForm" class="profile-form"><label>候选人<select id="orderCandidate"></select></label><label>事项<input id="orderSubject" required value="住房申请"></label><label class="wide">访谈或录音转写<textarea id="orderTranscript" rows="4"></textarea></label><label>转写来源<input id="orderSource"></label><button>建立工单</button></form><div id="orderTimeline" class="order-timeline"></div><form id="advanceForm" class="profile-form" hidden><label>经办人<input id="orderActor" required></label><label>办理日期<input id="orderDate" type="date" required></label><label id="materialsField" class="wide">已收材料<textarea id="orderMaterials" rows="2" placeholder="每行一项材料"></textarea></label><label id="receiptField" class="wide">办理凭据<input id="orderReceipt"></label><label id="unitField">选择房源<select id="orderUnit"></select></label><button id="advanceOrder">办理下一步</button></form></section>
<section id="supply" class="page" hidden><div class="section-head"><h2>政府与高校房源</h2><label class="file-button">接入房源<input id="supplyFile" type="file" accept=".json,application/json" hidden></label><button id="supplyTemplate">下载字段模板</button></div><div id="supplyTable" class="table-wrap"></div><div id="importPreview" hidden><h2>待接入房源</h2><div id="previewTable" class="table-wrap"></div><button id="confirmImport">确认接入</button><button id="cancelImport">取消</button></div></section>
<section id="ledger" class="page" hidden><h2>市场租金</h2><div id="ledgerTable" class="table-wrap"></div></section><section id="projects" class="page" hidden><h2>项目比较</h2><div id="projectsTable" class="table-wrap"></div></section>
<section id="scenario" class="page" hidden><h2>调租测算</h2><div class="scenario-grid"><label>市场参考租金<input id="market" type="number" min="0.01" value="80" step="0.1"></label><label>现行单位租金<input id="current" type="number" min="0" value="30"></label><label>住房面积<input id="area" type="number" min="1" value="60"></label><label>计租比例（%）<input id="ratio" type="number" min="0" max="100" value="40"></label><label>涨幅上限（%）<input id="cap" type="number" min="0" max="100" value="5"></label><label>家庭月收入<input id="income" type="number" min="1" value="10000"></label><label>另付费用<input id="fee" type="number" min="0" value="180"></label></div><div id="estimate" class="metrics"></div></section>
<section id="map" class="page" hidden><h2>住宅地图与街景</h2><button id="mapOpen">打开当前住宅地图</button><div id="locations" class="table-wrap"></div></section><section id="events" class="page" hidden><h2>深圳租金动态</h2><button id="eventNotify">开启系统推送</button><p id="eventState" role="status"></p><div id="eventTable" class="table-wrap"></div></section></main><script src="browser-bridge.js"></script><script src="three.min.js"></script><script src="spatial.js"></script><script src="app.js"></script><script src="residential-map.js"></script><script src="housing-ui.js"></script></body></html>
