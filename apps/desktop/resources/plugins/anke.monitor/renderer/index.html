<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anke 监测</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="anke-select.css"></head><body>
<header><strong>ANKE <span>监测</span></strong><nav><button id="wealth" aria-pressed="true">财富管理</button><button id="housing" aria-pressed="false">住房监测</button></nav><button id="refresh">刷新</button></header>
<main id="market"><section class="intro"><h1>看见市场，安排行动。</h1><p id="source">正在连接牛来行情</p></section><section id="metrics" class="metrics"></section>
<section class="panel overview"><div class="toolbar"><h2>市场看板</h2><button id="watchOnly" aria-pressed="false">只看自选</button><select id="board" aria-label="市场板块"><option value="">全部板块</option></select><button id="heatToggle" aria-pressed="true">热力图</button></div><div id="boardStats" class="board-stats"></div><div id="heatmap" class="heatmap"></div><p id="heatCaption"></p></section>
<section class="panel" id="detail" hidden><div class="toolbar"><h2 id="stockTitle"></h2><button id="watchStock" aria-pressed="false">加入自选</button><button id="closeDetail">关闭详情</button></div><div id="stockFacts" class="stock-facts"></div><div class="toolbar periods"><button data-period="day" aria-pressed="true">日 K</button><button data-period="week" aria-pressed="false">周 K</button><button data-period="month" aria-pressed="false">月 K</button><span class="ma-legend">MA5 / MA10 / MA20</span><button id="chartReset">复位</button><button id="exportCSV" disabled>导出 CSV</button></div><p id="chartSource"></p><p id="chartReadout" aria-live="off"></p><canvas id="candles" tabindex="0" role="img" aria-label="历史 K 线与成交量，滚轮缩放，拖动或方向键查看历史"></canvas><p id="chartStatus" role="status"></p></section>
<section class="panel"><div class="toolbar"><h2>市场全景</h2><input id="search" type="search" aria-label="搜索名称或代码" placeholder="搜索名称或代码"><select id="sort" aria-label="行情排序"><option value="amount">成交额</option><option value="up">涨幅</option><option value="down">跌幅</option><option value="turnover">换手率</option></select></div><div id="breadth" class="breadth"></div><div class="table"><table><thead><tr><th>名称 / 代码</th><th>市场</th><th>价格</th><th>涨跌幅</th><th>成交额</th></tr></thead><tbody id="rows"></tbody></table></div><button id="more" hidden>显示更多</button></section></main>
<section id="housingView" hidden><iframe id="housingFrame" title="深圳住房监测" referrerpolicy="no-referrer"></iframe></section><p id="status" role="status"></p><script type="module" src="app.mjs"></script></body></html>
