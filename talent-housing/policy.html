<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>住小保 政策咨询</title>
<style>body{margin:0;background:#f5f5f5;color:#292929;font:15px/1.7 'Segoe UI','Microsoft YaHei',sans-serif}header{background:white;border-bottom:1px solid #ddd;padding:18px 28px}main{max-width:1000px;margin:auto;padding:24px}h1{font-size:22px;margin:0}h2{font-size:17px}form,.card{background:white;border:1px solid #ddd;border-radius:16px;padding:20px;margin-bottom:16px}input,select,button{font:inherit;border:1px solid #d9d9d9;border-radius:9px;padding:9px;background:white;color:inherit}input[type=search]{width:100%;box-sizing:border-box;margin:14px 0}button{background:#444;color:white;cursor:pointer}label{margin-right:12px}#status{min-height:24px}a{color:#42596d}p{margin:8px 0}.meta{color:#666}details{margin-top:12px}#notices{color:#70533d}@media(max-width:600px){main{padding:12px}label{display:block;margin:8px 0}}</style>
<header><h1>Anke · 住小保</h1></header><main><form id="search"><label>住房类型 <select id="category"><option value="all">请选择类型</option><option value="public_rental">公共租赁住房</option><option value="affordable_rental">政府配租保租房</option><option value="social_affordable">社会主体保租房</option><option value="talent_rental">高层次人才配租</option><option value="talent_sale">人才住房配售</option><option value="university">高校定向住房</option><option value="youth_transition">青年人才过渡住房</option></select></label><label>查询日期 <input id="asOf" type="date" required></label><label><input type="checkbox" id="historical">查看历史批次</label><input id="query" type="search" maxlength="500" placeholder="输入申请条件、租金、材料或办理问题" required><button id="submit">查询依据</button><p id="coverage" class="meta"></p></form><div id="status" role="status"></div><div id="notices"></div><div id="result"></div></main>
<script>
const token='__TOKEN__',el=id=>document.getElementById(id);el('asOf').value=new Date().toLocaleDateString('sv-SE');
async function api(input){const r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json','X-Anke-Token':token},body:JSON.stringify(input)});const data=await r.json();if(!r.ok)throw Error(data.error);return data;}
const p=(text,cls)=>{const n=document.createElement('p');n.textContent=text;if(cls)n.className=cls;return n;};
api({action:'policy_coverage'}).then(d=>{const records=d.documents.filter(x=>x.status==='collected');el('coverage').textContent=`已采集 ${new Set(records.map(x=>x.url)).size} 份官方公开资料 · ${d.chunks} 个条款片段`;}).catch(e=>el('status').textContent=e.message);
el('search').onsubmit=async e=>{e.preventDefault();el('submit').disabled=true;el('status').textContent='正在查询';try{const input={query:el('query').value,category:el('category').value,asOf:el('asOf').value,includeHistorical:el('historical').checked};const d=await api({action:'policy_answer',...input});el('notices').replaceChildren(...d.notices.map(x=>p(x)));el('result').replaceChildren();if(d.plainLanguage){const card=document.createElement('section');card.className='card';card.id='plain-answer';const h=document.createElement('h2');h.textContent=d.plainLanguage.title;card.append(h,p(d.plainLanguage.summary),p('下一步：'+d.plainLanguage.nextStep),p('通俗解读草稿 · 待业务审核','meta'));el('result').append(card);}for(const [i,c]of d.citations.entries()){const article=document.createElement('article');article.className='card';const h=document.createElement('h2');h.textContent=`依据 ${i+1} · ${c.section}`;article.append(h,p(c.title),p(`${c.publishedOn??'发布日期待核实'} · ${c.historicalBatch?'历史批次':'公开政策资料'}`,'meta'),p(c.excerpt));const a=document.createElement('a');a.textContent='查看官方原文';a.href=c.url;a.target='_blank';a.rel='noopener noreferrer';article.append(a);el('result').append(article);}if(!d.citations.length)el('result').append(p(d.answer));el('status').textContent=d.requiresHuman?'需要补充信息或由业务人员核实':'已列出相关原文依据';}catch(err){el('status').textContent=err.message;}finally{el('submit').disabled=false;}};
</script></html>
