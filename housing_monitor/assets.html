<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>资产管理 · Anke</title><link rel="stylesheet" href="/housing_monitor/style.css"></head>
<body><header class="topbar"><a class="brand" href="/housing_monitor/">ANKE<span>资产管理</span></a><nav><a href="/housing_monitor/">住房监测</a></nav><a href="https://niulai-66977.app.workbuddy.host/" target="_blank" rel="noopener noreferrer">牛来可视化</a></header>
<main><div class="filterbar"><label>月份<input id="month" type="month"></label><button id="refresh">刷新</button></div><section id="metrics" class="summary"></section>
<div class="dashboard"><section class="panel map-panel"><div class="panel-head"><h1>资产全景</h1><span id="count"></span></div><div id="portfolio"></div></section><section class="panel"><div class="panel-head"><h2>租约提醒</h2></div><div id="leases"></div></section>
<section class="panel"><div class="panel-head"><h2>新增资产</h2></div><form id="assetForm" class="asset-form"><label>资产名称<input name="name" required maxlength="160"></label><label>行政区<input name="district" required maxlength="30"></label><label>地址<input name="address" required maxlength="300"></label><label>状态<select name="status"><option value="occupied">在租</option><option value="vacant">空置</option><option value="maintenance">维护中</option></select></label><label>合同月租 · 元<input name="rent" type="number" min="0" step="0.01" required></label><label>租约到期<input name="leaseEnd" type="date"></label><button>保存资产</button></form></section>
<section class="panel"><div class="panel-head"><h2>登记收支</h2></div><form id="entryForm" class="asset-form"><label>资产<select name="assetId" id="assetId" required></select></label><label>类型<select name="kind"><option value="income">收入</option><option value="expense">支出</option></select></label><label>金额 · 元<input name="amount" type="number" min="0" step="0.01" required></label><label>备注<input name="note" maxlength="300"></label><button>登记收支</button></form></section>
<section class="panel"><div class="panel-head"><h2>本月流水</h2></div><div id="entries"></div></section><section class="panel map-panel"><div class="panel-head"><h2>收支走势</h2><span>近六个月</span></div><div id="cashChart" class="cash-chart"></div></section><section class="panel"><div class="panel-head"><h2>资产构成</h2></div><div id="composition"></div></section></div><div id="status" role="status"></div></main><script type="module" src="/housing_monitor/assets.mjs"></script></body></html>
