<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>深圳住房监测 · Anke</title><link rel="stylesheet" href="style.css"></head>
<body><header class="topbar"><a class="brand" href="/workspace/">ANKE<span>住房监测</span></a><nav><button class="selected" data-view="map">深圳平面</button><button data-view="buildings">建筑 3D</button><button data-view="model">SU 模型</button><a href="http://127.0.0.1:47836/">住宅识别</a><a href="/housing_monitor/assets/">资产管理</a></nav><div class="tools"><span id="updated"></span><button id="refresh">刷新</button></div></header>
<div class="filterbar"><label>范围<select id="district"><option value="">深圳全市</option></select></label><label>主题<select id="category"><option value="">全部动态</option></select></label><input id="search" type="search" placeholder="搜索片区、项目与消息" aria-label="搜索片区、项目与消息"><button id="layersButton">图层</button><label class="filebutton">接入地图<input id="geoFile" type="file" accept=".json,.geojson" hidden></label></div>
<main><section class="summary" id="metrics"></section><div class="dashboard"><section class="panel map-panel"><div class="panel-head"><h1 id="mapTitle">深圳平面</h1><span id="selection">深圳</span></div><div class="model-tools"><label class="filebutton">导入 SU 模型 · OBJ<input id="modelFile" type="file" accept=".obj" hidden></label><select id="modelUp" aria-label="模型向上轴"><option value="y">Y 轴向上</option><option value="z">Z 轴向上</option></select><select id="modelStyle" aria-label="模型显示样式"><option value="shaded">明暗</option><option value="white">白模</option><option value="wire">线框</option></select><label><input id="modelEdges" type="checkbox" checked>边线</label><button data-camera="iso">轴测</button><button data-camera="top">顶视</button><button data-camera="front">正视</button><span id="modelInfo" role="status"></span></div><div class="map-stage" id="mapStage"><canvas id="mapCanvas" aria-label="深圳住房空间视图"></canvas><div class="map-empty" id="mapEmpty"><strong>深圳，住有所向</strong><span>接入街区与建筑图层，展开住房全景</span><button id="importMap">接入 GeoJSON</button></div><aside class="layers" id="layers" hidden><label><input type="checkbox" id="districtLayer" checked>区域轮廓</label><label><input type="checkbox" id="buildingLayer" checked>建筑</label><label><input type="checkbox" id="homeLayer" checked>住房供应</label></aside><div class="map-controls"><button id="zoomIn" aria-label="放大">+</button><button id="zoomOut" aria-label="缩小">−</button><button id="resetMap">复位</button></div></div></section>
<section class="panel insight-panel"><div class="panel-head"><h2>AI 洞察</h2><button id="prepareInsight">整理线索</button></div><div id="insights" class="insights"></div><button class="agent-button" id="askAgent">交给 Anke 深入分析</button><p id="insightState" role="status"></p></section>
<section class="panel news-panel"><div class="panel-head"><h2>城市消息</h2><span id="newsCount"></span></div><div class="news-list" id="news"></div></section>
<section class="panel market-panel"><div class="panel-head"><h2>租金与住房</h2><a href="/workspace/">打开工作台</a></div><div id="market"></div><div id="homes"></div></section>
<section class="panel topics-panel"><div class="panel-head"><h2>片区动向</h2><span>深圳</span></div><div id="topics"></div><div id="sourceList"></div><a class="map-source" href="https://datav.aliyun.com/portal/school/atlas/area_selector" target="_blank" rel="noopener noreferrer">底图 · DataV</a></section></div><div id="status" role="status" aria-live="polite"></div></main><script src="three.min.js"></script><script type="module" src="app.mjs"></script></body></html>
