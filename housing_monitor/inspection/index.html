<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="anke-token" content="TOKEN"><title>住宅洞察 · Anke</title><link rel="stylesheet" href="style.css"></head><body>
<header><a href="http://127.0.0.1:47831/housing_monitor/">ANKE</a><h1>住宅洞察</h1><button id="export">导出分析</button></header>
<main><div class="property"><div><input id="asset" aria-label="住宅或项目名称" placeholder="输入住宅或项目名称"><div class="property-line">空间识别 <span>与居住环境分析</span></div></div><div class="actions"><select id="kind" aria-label="证据来源"><option value="street">街景照片</option><option value="su">SU 视图</option></select><label class="upload">上传图像<input id="image" type="file" accept="image/png,image/jpeg,image/webp"></label><button class="primary" id="automatic">开始识别</button></div></div>
<div class="layout"><section class="visual"><div class="section-head"><h2>住宅与周边</h2><button id="annotationToggle" aria-expanded="false">标注工具</button></div><div class="image-stage"><canvas id="canvas" width="1000" height="750" aria-label="住宅对象分割"></canvas><div id="imageEmpty">上传街景或 SU 视图</div></div><div id="objects"></div><div id="annotation" hidden><div class="toolbar"><input id="label" aria-label="对象类别" placeholder="对象类别"><select id="cue" aria-label="问题线索"><option value="">无问题标注</option><option value="crack">裂纹</option><option value="stain">污渍或渗水</option><option value="peeling">表层剥落</option><option value="obstruction">通行遮挡</option></select><button id="add">保存轮廓</button><button id="cancel">取消绘制</button><label class="upload">导入结果<input id="evidenceFile" type="file" accept=".json"></label></div></div><div class="image-footer"><span id="status" role="status">等待图像</span><button id="analyze">更新分析</button></div></section>
<aside class="analysis"><nav class="tabs"><button class="active" data-tab="overview">分析看板</button><button data-tab="history">历史资讯</button></nav><div id="overview"><section><div class="section-head"><h2>计算模型</h2><span class="tag">ANKE</span></div><div id="modelName" class="model-name">图像识别与环境分析</div><div id="parameters" class="parameter-grid"></div></section><section><h2>处理流程</h2><ol id="pipeline"><li>读取图像<span>待开始</span></li><li>识别空间对象<span>待开始</span></li><li>计算环境特征<span>待开始</span></li><li>汇总识别结果<span>待开始</span></li></ol></section><section><div class="section-head"><h2>环境特征</h2><span class="tag" title="各维度为轮廓覆盖的图像比例，同类区域取并集。不是宜居评分或实地面积。">图像占比</span></div><div id="radar"></div><div id="dimensions"></div></section><section><div class="section-head"><h2>Anke 解读</h2><button id="interpret">生成解读</button></div><div id="interpretation">选择图像，展开住宅分析</div><div id="findings"></div></section></div><div id="history" hidden><div class="section-head"><h2>房源历史资讯</h2><button id="refreshHistory">刷新</button></div><div id="news"></div></div></aside></div></main><script type="module" src="ui.mjs"></script></body></html>
